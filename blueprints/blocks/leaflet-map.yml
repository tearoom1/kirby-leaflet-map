name: Leaflet Map
icon: map
preview: fields
wysiwyg: true
tabs:
  content:
    fields:
      mapTitle:
        label: Map Title
        type: text
        help: Title to show above the map
      mapDescription:
        label: Map Description
        type: textarea
        size: small
        buttons: false
        help: Short description for the map
      displayMode:
        label: Display Mode
        type: toggles
        options:
          embedded: Embedded
          popup: Popup with Thumbnail
      thumbnail:
        when:
          displayMode: popup
        label: Map Thumbnail
        type: files
        layout: cards
        multiple: false
        size: small
        query: page.images
        uploads: true
        help: Image shown before the map is opened
        image:
          cover: true
          ratio: 16/9
          back: black
      defaultZoom:
        label: Default Zoom
        type: range
        default: 15
        min: 1
        max: 19
        step: 1
        width: 1/3
        help: Zoom level around the map center. Without a center, the map zooms in at most this far to show all locations.
      minZoom:
        label: Minimum Zoom
        type: range
        default: 10
        min: 1
        max: 19
        step: 1
        width: 1/3
        help: Minimum allowed zoom level (further out)
      maxZoom:
        label: Maximum Zoom
        type: range
        default: 19
        min: 1
        max: 22
        step: 1
        width: 1/3
        help: Maximum allowed zoom level (closer in)
      labels:
        label: Labels
        type: select
        # an empty value means: set per location
        placeholder: Set per location
        width: 1/2
        options:
          always: Always show
          hover: Show on hover
          none: Only in the popup
        help: Names of the locations and paths on the map
      legend:
        label: Legend
        type: toggle
        width: 1/2
        text: Show a legend below the map
        help: Lists the symbols, markers and paths, grouped by their legend entry
      mapItems:
        label: Map Locations
        type: structure
        help: Add locations to your map
        columns:
          icon:
            width: 1/8
          title:
            width: 3/8
          center:
            width: 1/8
          color:
            width: 1/8
          location:
            width: 2/8
        fields:
          title:
            label: Title
            type: text
          description:
            label: Description
            type: textarea
            size: small
          location:
            label: Location
            type: leaflet-location
            translate: false
          # Former coordinate fields, still read for existing content
          lat:
            type: hidden
          lng:
            type: hidden
          icon:
            label: Symbol
            type: leaflet-icon
          size:
            label: Size
            type: range
            min: 1
            max: 5
            step: 1
            default: 1
            width: 1/2
          color:
            label: Marker Color
            type: color
            default: "#3388ff"
            width: 1/2
            help: Custom color for this location marker
          category:
            label: Legend Entry
            type: text
            help: Locations with the same entry share one line in the legend. Without an entry, the name of the symbol is used, or "Location" for markers without a symbol.
          tooltip:
            label: Always show label
            type: toggle
            width: 1/3
            default: true
            help: Only if the map labels are set per location. Otherwise the title appears on hover
          center:
            label: Map Center
            type: toggle
            width: 1/3
            help: Center the map here. Without a center, the map shows all locations.
          hide:
            label: Hide this place
            type: toggle
            width: 1/3
      paths:
        label: Map Paths
        type: structure
        help: Add paths to your map
        columns:
          title:
            width: 1/2
          color:
            width: 1/2
        fields:
          title:
            label: Path Name
            type: text
          line:
            label: Path
            type: leaflet-path
            translate: false
          # Former points structure, still read for existing content
          points:
            type: hidden
          color:
            label: Path Color
            type: color
            default: "#0000FF"
            width: 1/2
          tooltip:
            label: Always show label
            type: toggle
            width: 1/2
            default: true
            help: Only if the map labels are set per location. Otherwise the name appears on hover
          category:
            label: Legend Entry
            type: text
            help: Paths with the same entry share one line in the legend. Paths without an entry appear together as "Path".
